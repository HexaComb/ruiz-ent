name: Media loading validation
on:
  pull_request:
    paths:
      - 'src/components/HeroBanner.astro'
      - 'src/components/BeforeAfterShowcase.astro'
      - 'src/components/DeferredVideoPoster.astro'
      - 'src/lib/video-poster.ts'
      - 'tests/video-poster.test.mjs'
      - 'src/lib/deferred-media.ts'
      - 'src/assets/hero/**'
      - 'public/_headers'
      - 'astro.config.mjs'
      - 'scripts/media-preview.mjs'
      - 'tests/media-loading.test.mjs'
      - '.github/workflows/hero-preview.yml'
permissions:
  contents: read
jobs:
  hero-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/hero-qa" --no-package-lock --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/hero-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop and mobile hero without submitting forms
        run: |
          test -f dist/client/index.html
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist/client > /tmp/hero-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          node scripts/media-preview.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hero-preview-${{ github.event.pull_request.head.sha }}
          path: hero-preview/
          if-no-files-found: warn
          retention-days: 7
