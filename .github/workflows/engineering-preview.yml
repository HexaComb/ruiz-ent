name: Engineering preview validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/images/engineering/**'
      - 'public/images/brand/**'
      - 'public/favicon.png'
      - 'public/apple-touch-icon.png'
      - 'scripts/engineering-preview.mjs'
      - '.github/workflows/engineering-preview.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
permissions:
  contents: read
jobs:
  engineering-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/engineering-qa" --no-package-lock --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/engineering-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify responsive section and navigation without submitting forms
        run: |
          test -f dist/client/index.html
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist/client > /tmp/engineering-server.log 2>&1 &
          node scripts/engineering-preview.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-preview-${{ github.event.pull_request.head.sha }}
          path: engineering-preview/
          if-no-files-found: warn
          retention-days: 7
